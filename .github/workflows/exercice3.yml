# Meta data du workflow
name: Exercice 3 Déploiement
# Événement Déclancher
on:
  workflow_dispatch: # veut dire que le workflow peut être lancé manuellement depuis l'interface github
    inputs:
      target:
        description: 'Environnement à deployer'
        required: true
        # c'est un select pour choisir entre plusieurs options quand on lance l'action dans github, 
        # on peut aussi mettre 'environment', cela prend tous les env déclarés dans github et ne pas ecrire d'options: ["staging", "production"]
        type: choice 
        options: ["staging", "production"]
permissions:
  contents: read
jobs:
  # ---------- 1) BUILD : on fabrique l'application une seule fois ----------
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Sauvegarder dist/ comme artefact
      # ---- on sauvegarde le build dans un artefact pour le réutiliser dans d'autres jobs ou workflows
      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/
          if-no-files-found: error # Verifier que le /dist existe
      # Ecrire un résumé du build
      - run: |
          echo "- Branche : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lancé par : ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node : $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Taille de dist/ : $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
  test: 
    # ---------- 2) TEST : on teste LE MÊME build sur 4 combinaisons ----------
    # attend la réussite de build avant de lancer le test
    needs: build
    # tester node.js 20 et 22 sur Ubuntu et Windows
    strategy:
      fail-fast: false # si un job échoue, les autres jobs continuent de s'executer
      max-parallel: 2 # executer 2 variantes (jobs) simultanement (ici on a node 20 et node 22, donc 4 jobs au total qui vont se lancer, mais max 2 jobs en parallèle)
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v7   # on récupère le build du job "build"
        with:
          name: application
          path: dist/
      - run: npm test
      
  deploy:
    needs: test
    runs-on: ubuntu-26.04
    environment:
      name: ${{ inputs.target }} # target c'est la valeur qu'on a choisi (juste en haut) dans le select quand on lance l'action dans github
      url: ${{ vars.API_URL }} # on peut utiliser des variables d'environnement (API_URL) pour stocker l'url de l'environnement de déploiement
    steps:
      # Récupère l'artefact du build, pour pourvoir utiliser l'artefact venant d'un autre job (donc d'un autre ordi/runner ubuntu)
      - uses: actions/download-artifact@v7 
        with:
          name: application
          path: dist/

      - name: Simuler le déploiement
        run: |
          echo "Déploiement vers : ${{ vars.API_URL }}"
        
      - name: Produire le résumé
        shell: bash
        run: |
          echo "## Déploiement" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environnement : ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL : ${{ vars.API_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
      